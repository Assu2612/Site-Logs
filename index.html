<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteTrack</title>
<meta name="theme-color" content="#1B1E22">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiteTrack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EC;--card:#fff;--ink:#1B1E22;--ink2:#5E646B;--ink3:#8A9097;--line:#E3DFD7;--acc:#F2B705;--accD:#B98A00;--steel:#2F5D7C;--ok:#2E7D4F;--warn:#B86E00;--bad:#BF3A2B;--chip:#EEEBE4;--dark:#1B1E22;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2}
/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--acc);color:var(--dark);display:grid;place-items:center;font:600 14px 'IBM Plex Mono',monospace;flex:none}
.brand{flex:1;min-width:0}
.b1{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--acc)}
.b2{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11px;color:#B9BEC4;display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:#6FCF97;display:inline-block}
.sync.local i{background:var(--acc)}
.pbtn{background:#2A2E33;border:1px solid #3A3F45;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;flex:none}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--acc) 0 10px,var(--dark) 10px 20px)}
main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
.note{background:#FFF4D1;border:1px solid #F0D98A;color:#6B5200;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* hero */
.hero{background:var(--dark);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border:22px solid rgba(242,183,5,.12);border-radius:50%}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:22px;margin:4px 0 2px}
.hero .sub{color:#B9BEC4;font-size:13px}
.dayc{text-align:right;flex:none}
.dayc .big{font-size:24px;font-weight:600}
.meter{margin-top:16px;display:grid;gap:6px}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:#D5D9DD}
.mrow b{color:#fff}
.htrack{height:10px;border-radius:6px;background:#30353B;overflow:hidden;margin-bottom:6px}
.htrack i{display:block;height:100%;border-radius:6px}
.t-time{background:#7C8794}.t-work{background:var(--acc)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:20px;margin-top:4px;width:max-content}
.verdict.ok{background:rgba(111,207,151,.15);color:#8FE0B0}.verdict.bad{background:rgba(235,87,87,.16);color:#FF9B8F}
/* kpis */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left}
.kl{font-size:12px;color:var(--ink2);font-weight:500}
.kv{font-size:26px;font-weight:600;margin:2px 0}
.kv small{font-size:13px;color:var(--ink2);font-weight:500;margin-left:2px}
.ks{font-size:12px;color:var(--ink3)}
.ks.bad{color:var(--bad);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 span{font-weight:400;font-size:12px;color:var(--ink3)}
/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}
.alert:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--acc)}.dot.info{background:var(--steel)}.dot.ok{background:var(--ok)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .v{font:500 10px 'IBM Plex Mono',monospace;color:var(--ink2);margin-bottom:3px}
.col .b{width:100%;max-width:26px;background:var(--steel);border-radius:4px 4px 0 0;min-height:2px}
.col .b.today{background:var(--acc)}
.col .b.zero{background:var(--line)}
.col .d{font:500 10px 'IBM Plex Mono',monospace;color:var(--ink3);margin-top:5px}
/* quick */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink)}
.qa svg{color:var(--steel)}
/* section header & items */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;gap:8px}
.sec-h h2{font-size:19px}
.sec-h .acts{display:flex;gap:6px}
.lnk{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--steel)}
.item{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;text-align:left}
.item.sev-Critical{border-left:4px solid var(--bad)}.item.sev-High{border-left:4px solid #E07A2E}.item.sev-Medium{border-left:4px solid var(--acc)}.item.sev-Low{border-left:4px solid #9AA3AB}
.date-blk{width:46px;flex:none;text-align:center;background:var(--chip);border-radius:10px;padding:5px 0}
.date-blk .dd{font-size:18px;font-weight:600;line-height:1.1}
.date-blk .mm{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.item-main{flex:1;min-width:0}
.it-t{font-weight:600;font-size:15px}
.it-s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-r{text-align:right;flex:none}
.big2{font-size:20px;font-weight:600;line-height:1.1}
.tiny{font-size:11px;color:var(--ink3)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.chip.ok{background:#E3F2E8;color:var(--ok)}.chip.bad{background:#F8E1DD;color:var(--bad)}.chip.warn{background:#FCEFC7;color:#8A5F00}.chip.steel{background:#E1EAF1;color:var(--steel)}.chip.mute{background:var(--chip);color:var(--ink3)}
.chips-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.track{height:8px;background:var(--chip);border-radius:5px;position:relative;margin:8px 0 4px}
.track i{display:block;height:100%;border-radius:5px;background:var(--steel)}
.track i.ok{background:var(--ok)}.track i.bad{background:var(--bad)}
.track em{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);border-radius:1px}
.row-sp{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sm .v{font-size:20px;font-weight:600}
.sm .l{font-size:11px;color:var(--ink2)}
.filters{display:flex;gap:6px;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500}
.fchip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{text-align:center;background:var(--card);border:1.5px dashed #D3CEC3;border-radius:var(--r);padding:28px 20px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--ink2);font-size:14px;margin:0 auto 14px;max-width:420px}
/* buttons */
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:var(--dark)}
.btn.dark{background:var(--dark);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #EBC4BE}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.full{width:100%}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ink3);position:relative}
.tab.on{color:var(--ink)}
.tab.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:78px;z-index:24;background:var(--acc);color:var(--dark);border:0;border-radius:30px;padding:13px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(27,30,34,.25)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,22,25,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:93vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:17px}
.xbtn{background:var(--chip);border:0;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.sh-b{overflow:auto;padding:14px 16px 24px}
/* forms */
form label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:12px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{display:block;width:100%;margin-top:5px;border:1px solid #D6D1C7;background:#fff;border-radius:10px;padding:11px 12px;font-size:15px;font-weight:400;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accD);box-shadow:0 0 0 3px rgba(242,183,5,.25)}
textarea{resize:vertical;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
fieldset{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px 4px;margin:0 0 14px}
legend{font-size:12px;font-weight:700;color:var(--ink);padding:0 6px;text-transform:uppercase;letter-spacing:.06em}
.step{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.step.total{border:0;font-weight:600;padding:9px 0}
.step.total b{font-size:18px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:600}
.stepper input{width:56px!important;text-align:center;margin:0!important;padding:7px 4px!important}
.chks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chk{margin:0!important;font-weight:500!important}
.chk input{display:none}
.chk span{display:inline-block;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--ink)}
.chk input:checked+span{background:var(--dark);color:#fff;border-color:var(--dark)}
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin:5px 0 12px}
.seg label{flex:1;margin:0;text-align:center}
.seg input{display:none}
.seg span{display:block;padding:9px;border-radius:9px;font-size:14px;color:var(--ink2)}
.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .pri,.actions .dark{flex:1}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.file{margin-bottom:14px!important;color:var(--ink)!important;font-size:14px!important;cursor:pointer}
.photos-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.photos-view img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0 0 12px}
.dl dt{color:var(--ink2)}
.dl dd{margin:0;font-weight:500;white-space:pre-wrap}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.blk h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.blk p{margin:0;white-space:pre-wrap;font-size:14px}
.log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;gap:8px}
.log:first-child{border-top:0}
.log .x{background:none;border:0;color:var(--ink3);font-size:18px;padding:0 4px}
.res{font-size:13px;margin:-4px 0 12px;color:var(--ink2)}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.pitem.on{border:2px solid var(--acc)}
.welcome{background:var(--dark);color:#fff;border-radius:20px;padding:26px 20px;text-align:left}
.welcome h1{font-size:26px;margin:10px 0 8px}
.welcome p{color:#C7CCD1;margin:0 0 16px}
.welcome ul{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:8px}
.welcome li{display:flex;gap:10px;font-size:14px;color:#E4E7EA}
.welcome li b{color:var(--acc);font-family:'IBM Plex Mono',monospace}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,#E9E6DF,#F2F0EB,#E9E6DF);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}

.hbtns{display:flex;gap:6px;flex:none}
.segtabs{display:flex;background:#E7E3DB;border-radius:12px;padding:3px;margin-bottom:12px}
.segtabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink2)}
.segtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.locbar{display:flex;gap:8px;margin-bottom:12px}
.locbar select{margin:0!important;padding:8px 10px!important;font-size:13px!important;background:#fff}
.locbar .clr{border:0;background:none;color:var(--steel);font-size:13px;font-weight:600;flex:none}
.loc-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--steel);font-weight:500}
.loc-tag:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--steel);display:inline-block}
.rowcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 0;margin-bottom:8px;position:relative}
.rowcard .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#fff;color:var(--ink3);font-size:16px;line-height:1}
.rowcard label{margin-bottom:10px}
.rowline{display:grid;grid-template-columns:1.4fr 1.2fr .7fr 28px;gap:6px;align-items:end;margin-bottom:6px}
.rowline.eq{grid-template-columns:1.6fr .6fr .6fr 28px}
.rowline input,.rowline select{margin:0!important;padding:9px 8px!important;font-size:14px!important}
.rowline .rm2{border:0;background:none;color:var(--ink3);font-size:20px;padding:0;height:38px}
.rowhead{display:grid;grid-template-columns:1.4fr 1.2fr .7fr 28px;gap:6px;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.rowhead.eq{grid-template-columns:1.6fr .6fr .6fr 28px}
.addrow{border:1.5px dashed #CFC9BD;background:none;border-radius:10px;width:100%;padding:9px;font-size:14px;font-weight:600;color:var(--steel);margin:2px 0 12px}
.ckitem{border-bottom:1px dashed var(--line);padding:8px 0}
.ckitem:last-child{border:0}
.ckitem .q{font-size:14px;margin-bottom:6px;color:var(--ink)}
.tri{display:flex;gap:6px;align-items:center}
.tri label{margin:0!important}
.tri input{display:none}
.tri span{display:inline-block;padding:5px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);background:#fff}
.tri input:checked+span.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.tri input:checked+span.nok{background:var(--bad);color:#fff;border-color:var(--bad)}
.tri input:checked+span.na{background:var(--ink3);color:#fff;border-color:var(--ink3)}
.tri .rk{flex:1;margin:0!important;padding:6px 8px!important;font-size:13px!important}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.presets button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500}
.presets button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.secs label{display:flex!important;align-items:center;gap:8px;margin:0!important;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px!important;color:var(--ink)!important;font-weight:500!important}
.secs input{width:18px;height:18px;accent-color:var(--dark);margin:0}
.progress-msg{font-size:13px;color:var(--ink2);text-align:center;margin-top:8px}
.tagsrc{font-size:10px;font-weight:700;color:var(--steel);background:#E1EAF1;border-radius:4px;padding:1px 5px;margin-left:4px}
.hint{font-size:12px;color:var(--ink3);margin:-6px 0 12px}
/* ---- simple UI ---- */
body{font-size:16px}
.hsec{font-size:17px;margin:4px 2px 10px}
.todaycard{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:#FFF6D6;border:2px solid var(--acc);border-radius:18px;padding:16px;margin-bottom:16px}
.todaycard.ok{background:#E8F4EC;border-color:#9CCFAE}
.tc-t{font-size:18px;font-weight:700;margin-top:2px}
.tc-s{font-size:13px;color:var(--ink2)}

(()=>{'use strict';
/* ================= helpers ================= */

const fmtDL=iso=>{if(!iso)return '';const d=new Date(iso+'T00:00:00');return `${String(d.getDate()).padStart(2,'0')}-${MON[d.getMonth()]}-${d.getFullYear()}`};
const wday=iso=>WD[new Date(iso+'T00:00:00').getDay()];

const inRange=(d,a,b)=>d&&d>=a&&d<=b;
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}

/* ================= constants ================= */
const TRADES=[['mason','Mason'],['carpenter','Carpenter'],['barbender','Bar bender'],['helper','Helper / Labour'],['electrician','Electrician'],['plumber','Plumber'],['welder','Welder / Fabricator'],['painter','Painter'],['tiler','Tiler'],['operator','Machine operator'],['staff','Engineer / Supervisor'],['other','Other']];

const WEATHER_T={sunny:'Sunny',cloudy:'Cloudy',rain:'Rain',heavy:'Heavy rain'};

const DEF_ACTS=[['Excavation','m³'],['PCC','m³'],['Footing / raft concrete','m³'],['Plinth beams','m³'],['Column concrete','m³'],['Slab & beam concrete','m³'],['Reinforcement','MT'],['Shuttering','m²'],['Blockwork','m³'],['Internal plaster','m²'],['External plaster','m²'],['Waterproofing','m²'],['Flooring / tiling','m²'],['Painting','m²']];
const PREPOUR=[['shut','Shuttering checked & approved'],['reinf','Reinforcement checked vs drawing / BBS'],['cover','Cover blocks & chairs in place'],['mep','Sleeves, conduits & inserts fixed'],['clean','Shuttering cleaned & wetted'],['vib','Vibrators + standby ready'],['moulds','Cube moulds ready'],['cj','Construction joint location decided'],['cure','Curing arrangement ready'],['appr','Consultant / client approval taken']];
const CK_TPL={
 'Shuttering / formwork':['Line, level & dimensions as per drawing','Props / staging plumb, spacing & base plates OK','Joints tight — no gaps for slurry loss','Release agent / shutter oil applied','Cleaned of debris, nails, binding wire','Openings, cut-outs & drops as per drawing','Safe access & edge protection provided'],
 'Reinforcement':['Bar dia & spacing as per drawing / BBS','Lap length & lap location (staggered) OK','Cover blocks of correct size provided','Chairs provided for top steel','Stirrups / ties spacing & 135° hooks OK','Binding tight at all junctions','Bars clean — no loose rust, oil or mud','Development length at supports OK'],
 'Pre-pour (pour card)':PREPOUR.map(x=>x[1]),
 'Blockwork':['Line, level & plumb OK','Joint thickness 10–12 mm / adhesive as specified','Blocks wetted / dust free','Lintel & sill bands as per drawing','Mesh at RCC–block junction','Curing done'],
 'Plaster':['Surface hacked & cleaned','Chicken mesh at RCC–block joints','Dots & screeds for line and level','Thickness & mix as specified','Corners & edges true','Curing for 7 days'],
 'Waterproofing':['Surface prepared, clean & dry','Coving / angle fillets at corners','Coats as per specification','Pipe & drain points sealed','Pond test 24/48 h passed','Protection screed laid'],
 'Tiling / flooring':['Base level & slope checked','Tile approved (batch / shade)','Joints uniform with spacers','Hollow sound check passed','Grouting & cleaning done'],
};
const COLLS=['dpr','acts','mat','pours','issues','indents','checks','exp','dwg','obs'];
const IC={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',dpr:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/>',progress:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',materials:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',concrete:'<path d="M4 9h16l-2 11H6z"/><path d="M8 9V5h8v4M9 13h6"/>',quality:'<path d="M9 11l2 2 4-4"/><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',issues:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'};
const icon=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const TABS=[['home','Home'],['dpr','DPR'],['progress','Progress'],['materials','Material'],['quality','Quality'],['more','More']];
const VALID_TABS=[...TABS.map(t=>t[0]),'concrete'];

/* ================= storage ================= */
const Store={mode:'loading',db:null,mem:{},subs:[],dl:null};
function lsLoad(){try{Store.mem=JSON.parse(localStorage.getItem('sitetrack.data')||'{}')||{}}catch(e){Store.mem={}}}
function lsSave(){try{localStorage.setItem('sitetrack.data',JSON.stringify(Store.mem));return true}catch(e){toast('Device storage full — download a backup and remove photos');return false}}

const IDB={db:null,fallback:false};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('sitetrack',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>{IDB.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
async function idbLoad(){
  if(!(await idbOpen())){IDB.fallback=true;lsLoad();return}
  Store.mem=await new Promise(res=>{const out={};try{const rq=IDB.db.transaction('docs','readonly').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res(out)}});
  try{const old=JSON.parse(localStorage.getItem('sitetrack.data')||'null');if(old&&!Object.keys(Store.mem).length){Store.mem=old;Object.entries(old).forEach(([k,v])=>idbPut(k,v));localStorage.removeItem('sitetrack.data')}}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
function idbPut(k,v){if(IDB.fallback){lsSave();return}try{const tx=IDB.db.transaction('docs','readwrite');tx.objectStore('docs').put(v,k);tx.onerror=()=>toast('Phone storage full — remove photos or download a backup')}catch(e){toast('Couldn’t save on phone storage')}}
function idbDel(k){if(IDB.fallback){lsSave();return}try{IDB.db.transaction('docs','readwrite').objectStore('docs').delete(k)}catch(e){}}
function localList(path){const pre=path+'/',n=path.split('/').length+1;return Object.keys(Store.mem).filter(k=>k.startsWith(pre)&&k.split('/').length===n).map(k=>Object.assign({},Store.mem[k],{id:k.split('/').pop()}))}
function localEmit(){Store.subs.forEach(s=>s.cb(localList(s.path)))}
function watch(path,cb){
  if(Store.mode==='cloud'){
    let done=false;const t=setTimeout(()=>{if(!done)setNote('Site data is slow to load — what you see may be out of date.')},10000);
    const un=Store.db.collection(path).onSnapshot(snap=>{
      if(!snap.metadata.fromCache&&!done){done=true;clearTimeout(t);setNote('')}
      cb(snap.docs.filter(d=>d.exists).map(d=>Object.assign({},d.data(),{id:d.id})));
    },err=>{done=true;clearTimeout(t);setNote(err&&err.code==='revoked'?'Access to this tracker changed.':'Live sync stopped. Reopen the page to reconnect.')});
    return ()=>{clearTimeout(t);try{un()}catch(e){}};
  }
  const s={path,cb};Store.subs.push(s);cb(localList(path));return ()=>{Store.subs=Store.subs.filter(x=>x!==s)};
}
function writeErr(e){const c=e&&e.code;
  if(c==='invalid_argument')toast('Couldn’t save — you may have view-only access, or the entry is too large (remove a photo).');
  else if(c==='quota_exceeded')toast('Storage limit reached — delete old entries or photos.');
  else if(c==='resource_exhausted')toast('Too many saves at once — wait a moment and retry.');
  else toast('Couldn’t save — check your connection and try again.');}
async function put(path,data){
  if(Store.mode==='cloud'){
    for(let i=0;i<2;i++){try{await Store.db.doc(path).set(data);return true}catch(e){if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,500+Math.random()*700));continue}writeErr(e);return false}}
  }
  Store.mem[path]=JSON.parse(JSON.stringify(data));idbPut(path,Store.mem[path]);localEmit();return true;
}
async function del(path){
  if(Store.mode==='cloud'){try{await Store.db.doc(path).delete();return true}catch(e){writeErr(e);return false}}
  Object.keys(Store.mem).forEach(k=>{if(k===path||k.startsWith(path+'/')){delete Store.mem[k];idbDel(k)}});localEmit();return true;
}
async function saveFile(name,data,label){
  const dl=Store.dl;
  if(!dl&&window.AndroidBridge){try{const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'});
    const mime=name.endsWith('.pdf')?'application/pdf':name.endsWith('.csv')?'text/csv':name.endsWith('.json')?'application/json':'application/octet-stream';
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});
    const uri=window.AndroidBridge.saveFile(name,b64,mime);if(!uri){toast('Couldn’t save the file');return false}
    window.__lastUri=uri;window.__lastMime=mime;
    openSheet((label||'File')+' saved',`<p style="margin:0 0 6px">Saved in <b>Downloads / SiteTrack</b></p><p class="tiny" style="margin:0 0 14px">${esc(name)}</p><div class="actions"><button class="btn ghost" data-a="nOpen">Open</button><button class="btn pri" data-a="nShare">Share (WhatsApp…)</button></div>`);return true}catch(e){toast('Couldn’t save the file');return false}}
  if(!dl){try{const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith('.csv')?'text/csv':name.endsWith('.json')?'application/json':'text/plain'});

      let x=this.M;cols.forEach((c,i)=>{cells[i].forEach((l,k)=>this.d.text(c.r?x+W[i]-3:x+3,this.y+fs+2.5+k*lh,l,{size:fs,bold,align:c.r?'right':undefined,color:r._c&&r._c[i]?r._c[i]:undefined}));x+=W[i]});
      this.y+=h;this.d.line(this.M,this.y,this.M+this.CW,this.y,'#E3DFD7',.4)});this.y+=10}
  note(t){this.ensure(16);this.d.text(this.M,this.y+9,t,{size:8.5,color:'#8A9097'});this.y+=18}
  photos(list,caption,cols){if(!list||!list.length)return;const n=cols||3,g=8,w=(this.CW-g*(n-1))/n,h=w*0.75;for(let i=0;i<list.length;i+=n){this.ensure(h+16);list.slice(i,i+n).forEach((src,j)=>{const x=this.M+j*(w+g);this.d.rect(x,this.y,w,h,'#ECE8E0');this.d.image(src,x,this.y,w,h)});this.y+=h+6}if(caption)this.note(caption)}
  signs(names){this.ensure(70);this.y+=26;const n=names.length,w=this.CW/n;names.forEach(([role,nm],i)=>{const x=this.M+i*w;this.d.line(x+6,this.y,x+w-14,this.y,'#1B1E22',.6);this.d.text(x+6,this.y+12,role,{size:8,bold:true});this.d.text(x+6,this.y+23,nm||'Name / Sign / Date',{size:7.5,color:'#5E646B'})});this.y+=34}
  finish(){const d=this.d,N=d.pages.length,p=curP()||{};const gen=new Date();d.pages.forEach((ops,i)=>{d.ops=ops;d.line(this.M,d.H-30,d.W-this.M,d.H-30,'#D9D4CA',.5);d.text(this.M,d.H-18,`${p.name||''} · ${this.title} · generated ${fmtDL(toISO(gen))} ${String(gen.getHours()).padStart(2,'0')}:${String(gen.getMinutes()).padStart(2,'0')}`,{size:7,color:'#8A9097'});d.text(d.W-this.M,d.H-18,`Page ${i+1} of ${N}`,{size:7,color:'#8A9097',align:'right'})});return d.output()}
}

function cubeInputs(p,age){const v=p['c'+age]||[];return`<div class="grid3">${[0,1,2].map(i=>`<label>Cube ${i+1}<input type="number" step="any" inputmode="decimal" name="c${age}_${i}" value="${v[i]?esc(v[i]):''}" placeholder="N/mm²"></label>`).join('')}</div><div class="res" id="r${age}"></div>`}
function cubeLine(r,age){if(!r)return'Enter results in N/mm² when tested.';let s=`Average <b class="mono">${fmt(r.avg,2)}</b> N/mm² · <span class="chip ${r.c}">${r.s}</span> <span class="tiny">${r.ex}</span>`;
  const tol=r.fck<=15?3:4;
  if(age===28&&r.s==='Marginal')s+=`<br><span class="tiny">Below fck but within fck−${tol}: acceptable only if the mean of 4 consecutive samples ≥ fck + ${tol} (IS 456 Table 11). Check group results.</span>`;
  if(age===28&&r.s==='Fail')s+=`<br><span class="tiny">Below fck−${tol}. Report to the structural consultant — core tests / NDT may be needed.</span>`;
  if(age===7&&r.s==='Low')s+=`<br><span class="tiny">7-day strength usually reaches ~65% of fck for OPC. Watch the 28-day result.</span>`;
  if(r.dev)s+=`<br><span class="tiny" style="color:var(--bad)">A cube varies more than ±15% from the average — sample may be invalid (IS 456 cl. 15.4).</span>`;return s}

function projSnap(p){const D=p.id===st.pid?st:PORT.data[p.id];if(!D)return null;const t=todayISO();

  const total=p.start&&p.finish?Math.max(1,daysBetween(p.start,p.finish)):null;
  const td=(D.dpr||[]).find(d=>d.date===t);
  return{work:W?S/W:null,time:total?clamp(daysBetween(p.start,t)/total*100,0,100):null,td,mp:td?mpTotal(td):null,

function weekText(){const p=curP(),t=todayISO(),wk=addDays(t,-6);const d7=st.dpr.filter(d=>inRange(d.date,wk,t));const L=[];
  L.push(`*WEEKLY SITE SUMMARY*`);L.push(`*${p.name}* — ${fmtD(wk)} to ${fmtD(t)}`);L.push('');
  const s=projSnap(p);if(s)L.push(`Progress: ${s.work!=null?fmt(s.work,1)+'%':'—'} done vs ${s.time!=null?fmt(s.time,0)+'%':'—'} time`);
  L.push(`DPRs: ${d7.length}/7 · Man-days: ${fmt(d7.reduce((x,d)=>x+mpTotal(d),0),0)}`);
  const c=st.pours.filter(x=>inRange(x.date,wk,t));if(c.length)L.push(`Concrete: ${fmt(c.reduce((x,y)=>x+num(y.qty),0),1)} m³ (${c.map(x=>pourDesc(x)+(locStr(placeOf(x))?' '+locStr(placeOf(x)):'')).join('; ')})`);

async function pinHash(pin,salt){const s=`${salt}|${pin}|sitetrack`;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(16)}}
const pinOf=p=>p&&p.mgrPin&&p.mgrPin.hash?p.mgrPin:null;
function mgrUnlocked(p){p=p||curP();const pin=pinOf(p);if(!pin)return true;if(ME.readonly)return true;return lsGet('sitetrack.mgrok.'+p.id)===pin.hash}

  if(k==='week'){const dow=(d.getDay()+6)%7;return[addDays(t,-dow),t]}

  if(k==='lmonth'){const f=new Date(d.getFullYear(),d.getMonth()-1,1),l=new Date(d.getFullYear(),d.getMonth(),0);return[toISO(f),toISO(l)]}

  return[t,t]}

function csv(rows){return'﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}

  if(t==='checks')return csv([['Date','Checklist','Wing','Floor','Area','Result','Checkpoint','Status','Remark','Inspected by'],...st.checks.flatMap(c=>{const l=placeOf(c);return(c.items||[]).map(i=>[c.date,c.type,l.w,l.f,l.a,ckResult(c),i.t,i.s==='ok'?'OK':i.s==='nok'?'Not OK':i.s==='na'?'N/A':'',i.r,c.by])})]);

  try{await sheetSubmit(new FormData(e.target),e.target)}finally{busy=false;if(b&&b.isConnected)b.disabled=false}
});
function rowInput(e){const t=e.target,k=t.dataset.r;if(!k)return false;const r=FR[k][num(t.dataset.i)];if(!r)return true;const f=t.dataset.f;
  if(f.startsWith('place.')){r.place=r.place||{};r.place[f.slice(6)]=t.value}else r[f]=t.value;
  if(k==='labour')updMp();
  if(k==='items'&&f==='act'&&e.type==='change'){const a=st.acts.find(x=>x.id===t.value);if(a){r.u=a.unit||r.u;const pl=placeOf(a);if(pl.w||pl.f||pl.a)r.place=Object.assign({},pl)}drawRows('items')}
  return true}
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const r=$('#qres');if(r)r.innerHTML=searchHTML(st.q);return}const lb=e.target.dataset&&e.target.dataset.lab;if(lb){setLab(lb,num(e.target.value));drawLab(false);return}if(rowInput(e))return;const n=e.target.name||'';if(/^c(7|28)_/.test(n))updCube()});
document.addEventListener('change',async e=>{
  const t=e.target;if(t.dataset&&t.dataset.r){rowInput(e);return}
  if(t.dataset&&t.dataset.lf){st.locF[t.dataset.lf]=t.value;render();return}
  if(t.name==='grade')updCube();
  if(t.id==='midSel'){const b=$('#newMatBox');if(b){b.style.display=t.value==='__new'?'block':'none';if(t.value==='__new')setTimeout(()=>{const i=document.querySelector('#f [name=nm]');i&&i.focus()},30)}}
  if(t.name==='nm'){const sug=MAT_SUGG.find(([n])=>n.toLowerCase()===t.value.trim().toLowerCase());const u=document.querySelector('#f [name=nu]');if(sug&&u)u.value=sug[1]}
  if(t.name==='type'&&$('#grpIn')){$('#grpIn').style.display=t.value==='in'?'block':'none';$('#grpOut').style.display=t.value==='out'?'block':'none'}
  if(t.name==='ctype'){FR.ck=(CK_TPL[t.value]||[]).map(x=>({t:x,s:'',r:''}));const el=$('#ckItems');if(el)el.innerHTML=ckItemsHTML()}
  if(t.name==='from'||t.name==='to'){document.querySelectorAll('.presets button').forEach(b=>b.classList.remove('on'))}
  if(t.id==='bkIn'){const f=t.files[0];if(f){doRestore(await f.text())}return}
  if(t.id!=='phIn'&&t.id!=='phCam')return;const files=[...t.files];t.value='';
  for(const f of files){if(formPhotos.length>=photoLimit){toast(`Up to ${photoLimit} photos per entry`);break}try{formPhotos.push(await compress(f))}catch(err){toast('Couldn’t read that image')}}
  drawPhotos();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newAg'){e.preventDefault();A.labAddAg();return}if(e.key==='Enter'&&e.target.closest&&e.target.closest('form.wiz')&&e.target.tagName==='INPUT'){e.preventDefault();return}if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
function setTab(t){st.tab=VALID_TABS.includes(t)?t:'home';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)||'home'));

/* ================= boot ================= */
async function boot(){
  st.tab=VALID_TABS.includes(location.hash.slice(1))?location.hash.slice(1):'home';
  render();
  const use=n=>{try{return window.claude&&typeof window.claude.use==='function'?window.claude.use(n).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
  const [db,dl,usr]=await Promise.all([use('db'),use('downloads'),use('user')]);
  Store.user=usr||null;
  if(usr){try{const w=await usr.can('data.write');if(w===false){ME.readonly=true;if(!lsGet('sitetrack.role'))ME.role='manager'}}catch(e){}}
  Store.dl=dl||null;
  if(db){Store.mode='cloud';Store.db=db}else{Store.mode='local';await idbLoad()}
  let first=true;
  watch('projects',list=>{
    st.projects=list.sort((a,b)=>num(a.created)-num(b.created));
    const want=lsGet('sitetrack.pid'),has=id=>st.projects.some(p=>p.id===id);
    if(first||!has(st.pid)){first=false;const keep=has(want)?want:has(st.pid)?st.pid:(st.projects[0]?st.projects[0].id:null);if(keep!==st.pid||!unsubs.length)selectProject(keep)}
    st.ready=true;render();
  });
}
window.__st=st;
window.__back=()=>{if(!$('#sheetWrap').hidden){closeSheet();return true}if(st.tab!=='home'){location.hash='';setTab('home');return true}return false};
if(!window.AndroidBridge&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
})();

</script>
